name: QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - data/eventflow-data.json

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:browser
        env:
          EVENTFLOW_QA_START: '1'
          EVENTFLOW_QA_URL: http://127.0.0.1:4173/EventFlow/
